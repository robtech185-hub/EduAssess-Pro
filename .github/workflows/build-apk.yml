name: build-apk
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: تجهيز ملفات التطبيق (www)
        run: |
          for f in native.js proctor.js android-native/ExamLockPlugin.java android-native/MainActivity.java; do
            [ -f "$f" ] || { echo "ملف ناقص في المستودع: $f"; exit 1; }
          done
          mkdir -p www
          cp index.html exam.html teacher.html i18n.js i18n-dict.js push.js native.js proctor.js sw.js ui.js ui.css manifest.webmanifest www/
          cp -r assets www/assets
          if [ -f supabase.js ]; then cp supabase.js www/; else echo "::warning::supabase.js غير موجود في المستودع — لن يتصل التطبيق بقاعدة البيانات"; fi
          for f in assets/edu.css assets/edu.js; do
            [ -f "$f" ] || { echo "تنبيه: الملف غير موجود في المستودع وسيُنشأ فارغًا: $f"; touch "www/$f"; }
          done
          for f in assets/cert1.webp assets/cert2.webp assets/cert3.webp assets/cert4.webp assets/poster.jpg assets/promo.mp4 assets/student.png assets/teacher.png; do
            [ -f "$f" ] || echo "تنبيه: صورة ناقصة ستظهر مكسورة في الصفحة الرئيسية: $f"
          done

      - name: إنشاء مشروع أندرويد (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7 @capacitor/push-notifications@7 sharp@0.33
          npx cap init "EduAssess Pro" com.eduassess.app --web-dir www
          npx cap add android

      - name: أيقونة التطبيق
        run: |
          cat > icon.js <<'EOF'
          const sharp = require("sharp");
          const R = "android/app/src/main/res";
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const [d, s] of Object.entries(sizes)) {
              for (const n of ["ic_launcher", "ic_launcher_round", "ic_launcher_foreground"]) {
                await sharp("assets/logo.png").resize(s, s, { fit: "contain", background: { r: 255, g: 255, b: 255, alpha: 0 } }).png().toFile(R + "/mipmap-" + d + "/" + n + ".png");
              }
            }
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          node icon.js

      - name: صلاحيات الإشعارات
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: قفل الاختبار + الكاميرا (أندرويد)
        run: |
          D=android/app/src/main/java/com/eduassess/app
          mkdir -p "$D"
          cp android-native/ExamLockPlugin.java android-native/MainActivity.java "$D/"
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.camera.front" android:required="false"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || { echo "::error::فشل إضافة صلاحية الكاميرا"; exit 1; }
          grep -q 'ExamLockPlugin' "$D/MainActivity.java"

      - name: Firebase (إشعارات تصل والتطبيق مغلق)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Firebase اختياري: غيابه (أو خطؤه) لا يُفشل البناء، بل يُبنى التطبيق بدون إشعارات FCM (تبقى تنبيهات الجدولة المحلية تعمل)
          FCM=0
          if [ -z "$GSJ" ]; then
            echo "::warning::السر GOOGLE_SERVICES_JSON غير موجود — سيُبنى التطبيق بدون إشعارات FCM (الإشعارات الفورية والتطبيق مغلق). لتفعيلها أضف السر من Settings > Secrets and variables > Actions."
          elif ! { case "$GSJ" in "{"*) printf '%s' "$GSJ" > android/app/google-services.json ;; *) echo "$GSJ" | base64 -d > android/app/google-services.json 2>/dev/null ;; esac; }; then
            echo "::warning::قيمة GOOGLE_SERVICES_JSON غير صالحة (ضع محتوى الملف JSON كما هو، أو base64) — سيُبنى التطبيق بدون FCM."
            rm -f android/app/google-services.json
          elif ! grep -q '"package_name": *"com.eduassess.app"' android/app/google-services.json; then
            echo "::warning::package_name داخل google-services.json يجب أن يكون com.eduassess.app — سيُبنى التطبيق بدون FCM."
            rm -f android/app/google-services.json
          else
            FCM=1; echo "تم وضع google-services.json"
          fi
          # بدون FCM نعطّل تسجيل الإشعارات في الواجهة حتى لا ينهار التطبيق عند تشغيله
          if [ "$FCM" = "0" ]; then sed -i '1i window.EDU_NO_FCM=true;' www/native.js; fi

      - run: npx cap sync android

      - name: توقيع ثابت للتطبيق (ليُحدَّث فوق النسخة القديمة)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "تم استخدام المفتاح الثابت"
          else
            echo "::warning::السر DEBUG_KEYSTORE غير موجود — كل نسخة تُبنى بتوقيع جديد، وسيحتاج المستخدم لحذف التطبيق القديم قبل تثبيت الجديد."
          fi

      - name: بناء ملف APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EduAssess-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: نشر الـ APK برابط مباشر (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk EduAssess.apk
          gh release delete apk-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest EduAssess.apk --repo "$GITHUB_REPOSITORY" --title "EduAssess Pro — آخر نسخة" --notes "تم البناء تلقائيًا" --latest
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/apk-latest/EduAssess.apk"
          echo "الرابط المباشر: $URL"
          echo "### رابط التحميل المباشر\n$URL" >> "$GITHUB_STEP_SUMMARY"
